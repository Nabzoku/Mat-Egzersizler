<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sözel Problemler Hız Testi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 550px;
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: #1e3c72;
            margin-bottom: 10px;
            font-size: 24px;
        }

        p.subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8f9fa;
            padding: 12px 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            font-weight: 600;
            color: #333;
        }

        .timer {
            color: #e74c3c;
            font-size: 18px;
        }

        .question-box {
            font-size: 18px;
            font-weight: 500;
            color: #2c3e50;
            margin: 25px 0;
            min-height: 90px;
            text-align: left;
            line-height: 1.5;
            background: #f4f6f9;
            padding: 18px;
            border-radius: 10px;
            border-left: 5px solid #2a5298;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="number"] {
            flex: 1;
            padding: 14px;
            font-size: 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            border-color: #2a5298;
        }

        button {
            background: #2a5298;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }

        button:hover {
            background: #1e3c72;
        }

        button:active {
            transform: scale(0.98);
        }

        .hidden {
            display: none;
        }

        .results {
            text-align: left;
        }

        .results h2 {
            text-align: center;
            color: #1e3c72;
            margin-bottom: 15px;
        }

        .result-summary {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            font-size: 13px;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-details {
            display: flex;
            flex-direction: column;
            gap: 2px;
            max-width: 70%;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
            white-space: nowrap;
        }

        .badge.correct {
            background: #d4edda;
            color: #155724;
        }

        .badge.incorrect {
            background: #f8d7da;
            color: #721c24;
        }

        .scroll-area {
            max-height: 250px;
            overflow-y: auto;
            margin-bottom: 20px;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 10px;
        }
    </style>
</head>
<body>

<div class="card">
    <!-- Başlangıç Ekranı -->
    <div id="start-screen">
        <h1>Sözel Problemler Hız Testi</h1>
        <p class="subtitle">10 adet toplama-çıkarma problemini çözün.<br>Hedef Süre: 2 dakika 40 saniye (160sn)</p>
        <button onclick="startTest()">Testi Başlat</button>
    </div>

    <!-- Test Ekranı -->
    <div id="quiz-screen" class="hidden">
        <div class="stats-bar">
            <span>Soru: <span id="current-q">1</span>/10</span>
            <span class="timer" id="timer">02:40</span>
        </div>

        <div class="question-box" id="question-text">
            Yükleniyor...
        </div>

        <form id="quiz-form" onsubmit="handleAnswer(event)">
            <div class="input-group">
                <input type="number" id="answer-input" placeholder="Cevabınız" required autofocus>
                <button type="submit">İleri</button>
            </div>
        </form>
    </div>

    <!-- Sonuç Ekranı -->
    <div id="result-screen" class="hidden">
        <div class="results">
            <h2>Test Tamamlandı!</h2>
            
            <div class="result-summary">
                <div class="result-item">
                    <span>Geçen Süre:</span>
                    <strong id="final-time">00:00</strong>
                </div>
                <div class="result-item">
                    <span>Süre Durumu:</span>
                    <strong id="time-status">-</strong>
                </div>
                <div class="result-item">
                    <span>Doğru Sayısı:</span>
                    <strong id="correct-count" style="color: #27ae60;">0</strong>
                </div>
                <div class="result-item">
                    <span>Yanlış Sayısı:</span>
                    <strong id="wrong-count" style="color: #c0392b;">0</strong>
                </div>
            </div>

            <div class="scroll-area" id="details-list">
                <!-- Detaylar buraya gelecek -->
            </div>

            <button onclick="resetTest()" style="width: 100%;">Yeni Sorularla Tekrar Dene</button>
        </div>
    </div>
</div>

<script>
    let questions = [];
    let currentIndex = 0;
    let userAnswers = [];
    let timerInterval = null;
    let secondsPassed = 0;
    const TIME_LIMIT = 160; // 2 dk 40 sn = 160 saniye

    function getRandomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    // Görseldeki 10 sorunun birebir kalıplarına göre rastgele soru üreteci
    function generateQuestions() {
        const templates = [
            // 1. Şezlong sorusu kalıbı
            () => {
                const baslangic = getRandomInt(250, 450);
                const kaldirilan = getRandomInt(80, 150);
                const eklenen = getRandomInt(30, 80);
                return {
                    text: `Bir sahilde sabah ${baslangic} şezlong vardır. Gün içinde ${kaldirilan} tanesi kaldırılır, akşam ${eklenen} şezlong tekrar yerleştirilir. Gün sonunda sahilde kaç şezlong kalmıştır?`,
                    ans: baslangic - kaldirilan + eklenen
                };
            },
            // 2. Seramik atölyesi tabak sorusu kalıbı
            () => {
                const baslangic = getRandomInt(120, 250);
                const satilan = getRandomInt(30, 80);
                const yapilan = getRandomInt(20, 60);
                return {
                    text: `Bir seramik atölyesinde ${baslangic} tabak vardır. ${satilan} tabak satılır, ${yapilan} yeni tabak yapılır. An itibarıyla atölyede kaç tabak bulunmaktadır?`,
                    ans: baslangic - satilan + yapilan
                };
            },
            // 3. Tamirci bisiklet sorusu kalıbı
            () => {
                const baslangic = getRandomInt(30, 70);
                const tamirEdilen = getRandomInt(10, 25);
                const gelen = getRandomInt(5, 20);
                return {
                    text: `Bir tamirci gün içinde ${baslangic} adet bisiklet teslim alır. ${tamirEdilen}'inin tamirini bitirir, ${gelen} adet tamir edilmesi gereken bisiklet daha gelir. Tamircide kaç bisiklet bulunmaktadır?`,
                    ans: baslangic - tamirEdilen + gelen
                };
            },
            // 4. Site yönetimi aidat kasası sorusu kalıbı (Binli sayılar)
            () => {
                const baslangic = getRandomInt(12000, 25000);
                const gider = getRandomInt(2000, 5000);
                const toplanan = getRandomInt(1500, 4000);
                return {
                    text: `Bir site yönetimi aidat kasasında ${baslangic.toLocaleString('tr-TR')} ₺ bulur. ${gider.toLocaleString('tr-TR')} ₺ gider öder, ardından ${toplanan.toLocaleString('tr-TR')} ₺ daha toplanır. Son halde, site yönetiminin aidat kasasında kaç ₺ bulunmaktadır?`,
                    ans: baslangic - gider + toplanan
                };
            },
            // 5. Kargo şubesi paket sorusu kalıbı
            () => {
                const baslangic = getRandomInt(250, 500);
                const dagitimaCikan = getRandomInt(100, 200);
                const gelen = getRandomInt(50, 120);
                return {
                    text: `Bir kargo şubesine sabah ${baslangic} paket gelir. ${dagitimaCikan} paket dağıtıma çıkar, öğleden sonra ${gelen} paket daha gelir. An itibarıyla kargo şubesinde kaç paket bulunmaktadır?`,
                    ans: baslangic - dagitimaCikan + gelen
                };
            },
            // 6. Otel odası sorusu kalıbı
            () => {
                const baslangic = getRandomInt(180, 350);
                const bosalan = getRandomInt(50, 100);
                const dolan = getRandomInt(30, 80);
                return {
                    text: `Bir otelde sabah ${baslangic} oda doludur. Gün içinde ${bosalan} oda boşalır, ${dolan} oda yeniden dolar. Gün sonunda otelde kaç oda doludur?`,
                    ans: baslangic - bosalan + dolan
                };
            },
            // 7. Bahçıvan ağaç sorusu kalıbı
            () => {
                const dikilen = getRandomInt(60, 140);
                const kuruyan = getRandomInt(8, 25);
                const yeniDikilen = getRandomInt(10, 30);
                return {
                    text: `Bir bahçıvan ${dikilen} ağaç diker. ${kuruyan} ağaç kurur, ${yeniDikilen} yeni ağaç daha diker. Şu an bahçede kaç ağaç bulunmaktadır?`,
                    ans: dikilen - kuruyan + yeniDikilen
                };
            },
            // 8. Oto yıkama araç sorusu kalıbı
            () => {
                const baslangic = getRandomInt(25, 55);
                const yikanan = getRandomInt(10, 20);
                const sirayaGiren = getRandomInt(8, 18);
                return {
                    text: `Bir oto yıkamada ${baslangic} araç sıradadır. ${yikanan} araç yıkanıp çıkar, ${sirayaGiren} araç daha sıraya girer. Sırada kaç araç bulunmaktadır?`,
                    ans: baslangic - yikanan + sirayaGiren
                };
            },
            // 9. Balıkçı kg balık sorusu kalıbı
            () => {
                const baslangic = getRandomInt(400, 850);
                const satilan = getRandomInt(120, 250);
                const yakalanan = getRandomInt(60, 140);
                return {
                    text: `Bir balıkçı sabah ${baslangic} kg balık yakalar. ${satilan} kg'ını satar, akşam ${yakalanan} kg daha yakalar. Gün sonunda balıkçıda toplam kaç kg balık kalmıştır?`,
                    ans: baslangic - satilan + yakalanan
                };
            },
            // 10. Tiyatro salonu koltuk sorusu kalıbı (Binli sayılar)
            () => {
                const baslangic = getRandomInt(1200, 2200);
                const sokulen = getRandomInt(200, 450);
                const takilan = getRandomInt(150, 350);
                return {
                    text: `Bir tiyatro salonunda ${baslangic.toLocaleString('tr-TR')} koltuk vardır. ${sokulen} koltuk yenileme için sökülür, ${takilan} yeni koltuk takılır. Mevcut haliyle tiyatro salonunda toplam kaç adet koltuk bulunmaktadır?`,
                    ans: baslangic - sokulen + takilan
                };
            }
        ];

        return templates.map(generator => generator());
    }

    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function formatTime(secs) {
        const m = Math.floor(secs / 60).toString().padStart(2, '0');
        const s = (secs % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
    }

    function startTest() {
        const generated = generateQuestions();
        questions = shuffleArray(generated);
        
        currentIndex = 0;
        userAnswers = [];
        secondsPassed = 0;

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');

        updateTimerDisplay();
        showQuestion();

        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            secondsPassed++;
            updateTimerDisplay();
        }, 1000);
    }

    function updateTimerDisplay() {
        const remaining = TIME_LIMIT - secondsPassed;
        if (remaining >= 0) {
            document.getElementById('timer').textContent = formatTime(remaining);
            document.getElementById('timer').style.color = remaining <= 20 ? '#e74c3c' : '#2c3e50';
        } else {
            const extra = secondsPassed - TIME_LIMIT;
            document.getElementById('timer').textContent = `+${formatTime(extra)}`;
            document.getElementById('timer').style.color = '#e74c3c';
        }
    }

    function showQuestion() {
        const q = questions[currentIndex];
        document.getElementById('current-q').textContent = currentIndex + 1;
        document.getElementById('question-text').textContent = q.text;
        const input = document.getElementById('answer-input');
        input.value = '';
        input.focus();
    }

    function handleAnswer(e) {
        e.preventDefault();
        const input = document.getElementById('answer-input');
        const val = parseInt(input.value);

        if (isNaN(val)) return;

        userAnswers.push({
            question: questions[currentIndex].text,
            correct: questions[currentIndex].ans,
            user: val,
            isCorrect: val === questions[currentIndex].ans
        });

        currentIndex++;

        if (currentIndex < questions.length) {
            showQuestion();
        } else {
            finishTest();
        }
    }

    function finishTest() {
        clearInterval(timerInterval);

        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');

        document.getElementById('final-time').textContent = formatTime(secondsPassed);
        
        const statusEl = document.getElementById('time-status');
        if (secondsPassed <= TIME_LIMIT) {
            statusEl.textContent = "Sürede Yetişti! 🎯";
            statusEl.style.color = "#27ae60";
        } else {
            statusEl.textContent = "Süre Aşıldı ⏰";
            statusEl.style.color = "#c0392b";
        }

        let correct = 0;
        let wrong = 0;
        const detailsContainer = document.getElementById('details-list');
        detailsContainer.innerHTML = '';

        userAnswers.forEach((item, idx) => {
            if (item.isCorrect) correct++;
            else wrong++;

            const div = document.createElement('div');
            div.className = 'result-item';
            div.innerHTML = `
                <div class="result-details">
                    <strong>${idx + 1}. Soru</strong>
                    <span>Cevabınız: ${item.user.toLocaleString('tr-TR')}</span>
                </div>
                <span class="badge ${item.isCorrect ? 'correct' : 'incorrect'}">
                    ${item.isCorrect ? 'Doğru' : 'Yanlış (Doğru: ' + item.correct.toLocaleString('tr-TR') + ')'}
                </span>
            `;
            detailsContainer.appendChild(div);
        });

        document.getElementById('correct-count').textContent = correct;
        document.getElementById('wrong-count').textContent = wrong;
    }

    function resetTest() {
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('start-screen').classList.remove('hidden');
    }
</script>

</body>
</html>
