<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çarpma ve Bölme Hız Testi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 500px;
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: #1e3c72;
            margin-bottom: 10px;
            font-size: 24px;
        }

        p.subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8f9fa;
            padding: 12px 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            font-weight: 600;
            color: #333;
        }

        .timer {
            color: #e74c3c;
            font-size: 18px;
        }

        .question-box {
            font-size: 36px;
            font-weight: bold;
            color: #2c3e50;
            margin: 25px 0;
            min-height: 50px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="number"] {
            flex: 1;
            padding: 14px;
            font-size: 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            border-color: #2a5298;
        }

        button {
            background: #2a5298;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }

        button:hover {
            background: #1e3c72;
        }

        button:active {
            transform: scale(0.98);
        }

        .hidden {
            display: none;
        }

        .results {
            text-align: left;
        }

        .results h2 {
            text-align: center;
            color: #1e3c72;
            margin-bottom: 15px;
        }

        .result-summary {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .badge {
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
        }

        .badge.correct {
            background: #d4edda;
            color: #155724;
        }

        .badge.incorrect {
            background: #f8d7da;
            color: #721c24;
        }

        .scroll-area {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 20px;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 10px;
        }
    </style>
</head>
<body>

<div class="card">
    <!-- Başlangıç Ekranı -->
    <div id="start-screen">
        <h1>Çarpma & Bölme Hız Testi</h1>
        <p class="subtitle">Her başlatmada yeni 24 soru üretilir.<br>Hedef Süre: 2 dakika 25 saniye (145sn)</p>
        <button onclick="startTest()">Testi Başlat</button>
    </div>

    <!-- Test Ekranı -->
    <div id="quiz-screen" class="hidden">
        <div class="stats-bar">
            <span>Soru: <span id="current-q">1</span>/24</span>
            <span class="timer" id="timer">02:25</span>
        </div>

        <div class="question-box" id="question-text">
            ?
        </div>

        <form id="quiz-form" onsubmit="handleAnswer(event)">
            <div class="input-group">
                <input type="number" id="answer-input" placeholder="Cevabınız" required autofocus>
                <button type="submit">İleri</button>
            </div>
        </form>
    </div>

    <!-- Sonuç Ekranı -->
    <div id="result-screen" class="hidden">
        <div class="results">
            <h2>Test Tamamlandı!</h2>
            
            <div class="result-summary">
                <div class="result-item">
                    <span>Geçen Süre:</span>
                    <strong id="final-time">00:00</strong>
                </div>
                <div class="result-item">
                    <span>Süre Durumu:</span>
                    <strong id="time-status">-</strong>
                </div>
                <div class="result-item">
                    <span>Doğru Sayısı:</span>
                    <strong id="correct-count" style="color: #27ae60;">0</strong>
                </div>
                <div class="result-item">
                    <span>Yanlış Sayısı:</span>
                    <strong id="wrong-count" style="color: #c0392b;">0</strong>
                </div>
            </div>

            <div class="scroll-area" id="details-list">
                <!-- Detaylar buraya dinamik gelecek -->
            </div>

            <button onclick="resetTest()" style="width: 100%;">Yeni Sorularla Tekrar Dene</button>
        </div>
    </div>
</div>

<script>
    let questions = [];
    let currentIndex = 0;
    let userAnswers = [];
    let timerInterval = null;
    let secondsPassed = 0;
    const TIME_LIMIT = 145; // 2 dk 25 sn = 145 saniye

    function getRandomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    // Görseldeki 24 sorunun kalıplarına tam uyumlu rastgele soru üreteci
    function generateQuestions() {
        const templates = [
            // 1. -1 basamak × (-2 basamak) e.g., -6 × (-18)
            () => {
                const a = getRandomInt(4, 9);
                const b = getRandomInt(12, 19);
                return { text: `−${a} × (−${b})`, ans: (-a) * (-b) };
            },
            // 2. 3 basamak (10'un katı) ÷ 1 basamak e.g., 360 ÷ 4
            () => {
                const ans = getRandomInt(30, 90);
                const b = getRandomInt(3, 9);
                const a = ans * b;
                return { text: `${a} ÷ ${b}`, ans: ans };
            },
            // 3. 2 basamak × 2 basamak e.g., 25 × 16
            () => {
                const a = getRandomInt(15, 35);
                const b = getRandomInt(12, 25);
                return { text: `${a} × ${b}`, ans: a * b };
            },
            // 4. -3 basamak ÷ 2 basamak e.g., -720 ÷ 18
            () => {
                const ans = getRandomInt(20, 50);
                const b = getRandomInt(12, 25);
                const a = ans * b;
                return { text: `−${a} ÷ ${b}`, ans: -ans };
            },
            // 5. -3 basamak ÷ (-2 basamak) e.g., -168 ÷ (-14)
            () => {
                const ans = getRandomInt(11, 19);
                const b = getRandomInt(11, 16);
                const a = ans * b;
                return { text: `−${a} ÷ (−${b})`, ans: ans };
            },
            // 6. -2 basamak × (-1 basamak) e.g., -16 × (-7)
            () => {
                const a = getRandomInt(12, 25);
                const b = getRandomInt(4, 9);
                return { text: `−${a} × (−${b})`, ans: (-a) * (-b) };
            },
            // 7. -2 basamak ÷ (-1 basamak) e.g., -96 ÷ (-8)
            () => {
                const ans = getRandomInt(11, 19);
                const b = getRandomInt(6, 9);
                const a = ans * b;
                return { text: `−${a} ÷ (−${b})`, ans: ans };
            },
            // 8. -1 basamak × (-2 basamak) e.g., -7 × (-15)
            () => {
                const a = getRandomInt(5, 9);
                const b = getRandomInt(12, 19);
                return { text: `−${a} × (−${b})`, ans: (-a) * (-b) };
            },
            // 9. 3 basamak ÷ (-2 basamak) e.g., 600 ÷ (-15)
            () => {
                const ans = getRandomInt(20, 50);
                const b = getRandomInt(12, 20);
                const a = ans * b;
                return { text: `${a} ÷ (−${b})`, ans: -ans };
            },
            // 10. -2 basamak ÷ 2 basamak e.g., -84 ÷ 12
            () => {
                const ans = getRandomInt(6, 12);
                const b = getRandomInt(11, 16);
                const a = ans * b;
                return { text: `−${a} ÷ ${b}`, ans: -ans };
            },
            // 11. -3 basamak ÷ (-2 basamak) e.g., -150 ÷ (-25)
            () => {
                const ans = getRandomInt(5, 12);
                const b = getRandomInt(15, 30);
                const a = ans * b;
                return { text: `−${a} ÷ (−${b})`, ans: ans };
            },
            // 12. 3 basamak ÷ (-2 basamak) e.g., 960 ÷ (-24)
            () => {
                const ans = getRandomInt(30, 60);
                const b = getRandomInt(15, 25);
                const a = ans * b;
                return { text: `${a} ÷ (−${b})`, ans: -ans };
            },
            // 13. 4 basamak ÷ (-2 basamak) e.g., 1440 ÷ (-24)
            () => {
                const ans = getRandomInt(40, 80);
                const b = getRandomInt(18, 30);
                const a = ans * b;
                return { text: `${a} ÷ (−${b})`, ans: -ans };
            },
            // 14. 3 basamak ÷ 2 basamak (10'un katları) e.g., 280 ÷ 40
            () => {
                const ans = getRandomInt(5, 12);
                const b = getRandomInt(2, 6) * 10;
                const a = ans * b;
                return { text: `${a} ÷ ${b}`, ans: ans };
            },
            // 15. 2 basamak × (-1 basamak) e.g., 32 × (-4)
            () => {
                const a = getRandomInt(20, 45);
                const b = getRandomInt(3, 8);
                return { text: `${a} × (−${b})`, ans: a * (-b) };
            },
            // 16. -2 basamak × (-2 basamak) e.g., -11 × (-22)
            () => {
                const a = getRandomInt(11, 19);
                const b = getRandomInt(12, 25);
                return { text: `−${a} × (−${b})`, ans: (-a) * (-b) };
            },
            // 17. -4 basamak ÷ (-2 basamak) (10'un katları) e.g., -2100 ÷ (-70)
            () => {
                const ans = getRandomInt(20, 50);
                const b = getRandomInt(3, 8) * 10;
                const a = ans * b;
                return { text: `−${a} ÷ (−${b})`, ans: ans };
            },
            // 18. -2 basamak × 2 basamak e.g., -45 × 18
            () => {
                const a = getRandomInt(25, 55);
                const b = getRandomInt(12, 22);
                return { text: `−${a} × ${b}`, ans: (-a) * b };
            },
            // 19. (-2 basamak) × 1 basamak e.g., (-55) × 6
            () => {
                const a = getRandomInt(25, 65);
                const b = getRandomInt(4, 9);
                return { text: `(−${a}) × ${b}`, ans: (-a) * b };
            },
            // 20. 2 basamak × (-1 basamak) e.g., 15 × (-9)
            () => {
                const a = getRandomInt(12, 25);
                const b = getRandomInt(6, 9);
                return { text: `${a} × (−${b})`, ans: a * (-b) };
            },
            // 21. 2 basamak × (-1 basamak) e.g., 28 × (-6)
            () => {
                const a = getRandomInt(22, 45);
                const b = getRandomInt(4, 8);
                return { text: `${a} × (−${b})`, ans: a * (-b) };
            },
            // 22. 2 basamak × (-2 basamak) e.g., 18 × (-35)
            () => {
                const a = getRandomInt(12, 25);
                const b = getRandomInt(25, 45);
                return { text: `${a} × (−${b})`, ans: a * (-b) };
            },
            // 23. 3 basamak ÷ (-2 basamak) e.g., 720 ÷ (-20)
            () => {
                const ans = getRandomInt(25, 50);
                const b = getRandomInt(15, 30);
                const a = ans * b;
                return { text: `${a} ÷ (−${b})`, ans: -ans };
            },
            // 24. -3 basamak ÷ 2 basamak e.g., -840 ÷ 21
            () => {
                const ans = getRandomInt(30, 60);
                const b = getRandomInt(14, 25);
                const a = ans * b;
                return { text: `−${a} ÷ ${b}`, ans: -ans };
            }
        ];

        return templates.map(generator => generator());
    }

    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function formatTime(secs) {
        const m = Math.floor(secs / 60).toString().padStart(2, '0');
        const s = (secs % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
    }

    function startTest() {
        const generated = generateQuestions();
        questions = shuffleArray(generated);
        
        currentIndex = 0;
        userAnswers = [];
        secondsPassed = 0;

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');

        updateTimerDisplay();
        showQuestion();

        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            secondsPassed++;
            updateTimerDisplay();
        }, 1000);
    }

    function updateTimerDisplay() {
        const remaining = TIME_LIMIT - secondsPassed;
        if (remaining >= 0) {
            document.getElementById('timer').textContent = formatTime(remaining);
            document.getElementById('timer').style.color = remaining <= 20 ? '#e74c3c' : '#2c3e50';
        } else {
            const extra = secondsPassed - TIME_LIMIT;
            document.getElementById('timer').textContent = `+${formatTime(extra)}`;
            document.getElementById('timer').style.color = '#e74c3c';
        }
    }

    function showQuestion() {
        const q = questions[currentIndex];
        document.getElementById('current-q').textContent = currentIndex + 1;
        document.getElementById('question-text').textContent = `${q.text} = ?`;
        const input = document.getElementById('answer-input');
        input.value = '';
        input.focus();
    }

    function handleAnswer(e) {
        e.preventDefault();
        const input = document.getElementById('answer-input');
        const val = parseInt(input.value);

        if (isNaN(val)) return;

        userAnswers.push({
            question: questions[currentIndex].text,
            correct: questions[currentIndex].ans,
            user: val,
            isCorrect: val === questions[currentIndex].ans
        });

        currentIndex++;

        if (currentIndex < questions.length) {
            showQuestion();
        } else {
            finishTest();
        }
    }

    function finishTest() {
        clearInterval(timerInterval);

        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');

        document.getElementById('final-time').textContent = formatTime(secondsPassed);
        
        const statusEl = document.getElementById('time-status');
        if (secondsPassed <= TIME_LIMIT) {
            statusEl.textContent = "Sürede Yetişti! 🎯";
            statusEl.style.color = "#27ae60";
        } else {
            statusEl.textContent = "Süre Aşıldı ⏰";
            statusEl.style.color = "#c0392b";
        }

        let correct = 0;
        let wrong = 0;
        const detailsContainer = document.getElementById('details-list');
        detailsContainer.innerHTML = '';

        userAnswers.forEach((item, idx) => {
            if (item.isCorrect) correct++;
            else wrong++;

            const div = document.createElement('div');
            div.className = 'result-item';
            div.innerHTML = `
                <span>${idx + 1}. ${item.question} = <strong>${item.user}</strong></span>
                <span class="badge ${item.isCorrect ? 'correct' : 'incorrect'}">
                    ${item.isCorrect ? 'Doğru' : 'Yanlış (Doğru: ' + item.correct + ')'}
                </span>
            `;
            detailsContainer.appendChild(div);
        });

        document.getElementById('correct-count').textContent = correct;
        document.getElementById('wrong-count').textContent = wrong;
    }

    function resetTest() {
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('start-screen').classList.remove('hidden');
    }
</script>

</body>
</html>
